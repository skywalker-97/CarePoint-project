<svg width="260" height="50" viewBox="0 0 260 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="textGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- Icon Square -->
  <rect x="0" y="5" width="40" height="40" rx="12" fill="url(#iconGradA)"/>
  <!-- Cross -->
  <rect x="17.5" y="11" width="5" height="28" rx="2.5" fill="white"/>
  <rect x="8" y="20.5" width="24" height="5" rx="2.5" fill="white"/>

  <!-- Brand Name -->
  <text x="52" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="3" fill="#0D9488" opacity="0.7">HEALTHCARE</text>
  <text x="52" y="40" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5" fill="#0F172A">CarePoint</text>

  <!-- Admin Badge -->
  <rect x="175" y="14" width="80" height="24" rx="12" fill="url(#iconGradA)" opacity="0.12"/>
  <rect x="175" y="14" width="80" height="24" rx="12" stroke="#0D9488" stroke-width="1" stroke-opacity="0.3"/>
  <text x="215" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="2" fill="#0D9488" text-anchor="middle">ADMIN</text>
</svg>
