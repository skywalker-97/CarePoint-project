<svg width="200" height="44" viewBox="0 0 200 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Background — rounded square with gradient -->
  <rect x="0" y="2" width="40" height="40" rx="12" fill="url(#iconGrad)" filter="url(#glow)"/>

  <!-- White medical cross -->
  <rect x="17.5" y="8" width="5" height="28" rx="2.5" fill="white"/>
  <rect x="8" y="17.5" width="24" height="5" rx="2.5" fill="white"/>

  <!-- Tiny heartbeat pulse line inside cross -->
  <polyline points="11,20 14,20 16,14 18,26 20,20 24,20 26,20 29,20" stroke="url(#iconGrad)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>

  <!-- Brand Name -->
  <text x="52" y="18" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#0D9488" letter-spacing="0.08em" opacity="0.7">CARE</text>
  <text x="52" y="34" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="16" fill="#0F172A" letter-spacing="-0.02em">CarePoint</text>
  <rect x="52" y="37" width="72" height="2" rx="1" fill="url(#textGrad)" opacity="0.4"/>
</svg>
